<form [formGroup]="form" class="search-filter">
  <div class="filter-row">

    <!-- מספר בקשה -->
    <div class="filter-field">
      <label for="requestNumber">מספר בקשה</label>
      <input
        id="requestNumber"
        type="text"
        formControlName="requestNumber"
        placeholder="חיפוש חלקי..."
        autocomplete="off"
      />
    </div>

    <!-- סטטוס — checkboxes -->
    <div class="filter-field filter-field--checkboxes">
      <span class="filter-label">סטטוס</span>
      <div class="checkbox-group">
        <label *ngFor="let opt of statusOptions" class="checkbox-option">
          <input
            type="checkbox"
            [checked]="isStatusChecked(opt.value)"
            (change)="onStatusChange(opt.value, $any($event.target).checked)"
          />
          {{ opt.label }}
        </label>
      </div>
    </div>

    <!-- סוג בקשה — checkboxes -->
    <div class="filter-field filter-field--checkboxes">
      <span class="filter-label">סוג בקשה</span>
      <div class="checkbox-group">
        <label *ngFor="let opt of requestTypeOptions" class="checkbox-option">
          <input
            type="checkbox"
            [checked]="isTypeChecked(opt.value)"
            (change)="onTypeChange(opt.value, $any($event.target).checked)"
          />
          {{ opt.label }}
        </label>
      </div>
    </div>

    <!-- תאריך מ -->
    <div class="filter-field">
      <label for="createdFrom">מתאריך</label>
      <input
        id="createdFrom"
        type="date"
        formControlName="createdFrom"
      />
    </div>

    <!-- תאריך עד -->
    <div class="filter-field">
      <label for="createdTo">עד תאריך</label>
      <input
        id="createdTo"
        type="date"
        formControlName="createdTo"
        [class.input-error]="dateRangeError"
      />
    </div>

  </div>

  <!-- שגיאת טווח תאריכים -->
  <div *ngIf="dateRangeError" class="date-range-error">
    {{ dateRangeError }}
  </div>

  <!-- כפתורי פעולה -->
  <div class="filter-actions">
    <button type="button" class="btn-search" (click)="search()" [disabled]="!!dateRangeError">
      חפש
    </button>
    <button type="button" class="btn-clear" (click)="clearFilters()">
      נקה סינון
    </button>
  </div>
</form>
