<!-- דף Login — מוצג כשאין token תקין -->
<app-login *ngIf="!isLoggedIn" (loggedIn)="onLoggedIn()"></app-login>

<!-- דף ראשי — מוצג אחרי login -->
<div *ngIf="isLoggedIn" class="app-container">

  <div class="app-header">
    <h1 class="app-title">ניהול בקשות</h1>
    <div class="app-header-user">
      <span class="user-info" *ngIf="currentUser">
        משתמש {{ currentUser.userId }}
        <span class="user-badge--admin" *ngIf="currentUser.isAdmin">מנהל</span>
      </span>
      <button class="btn-logout" (click)="onLogout()">התנתק</button>
    </div>
  </div>

  <app-search-filter
    (filterChange)="onFilterChange($event)">
  </app-search-filter>

  <div *ngIf="loading" class="loading-indicator" aria-live="polite" aria-busy="true">
    <span class="spinner" aria-hidden="true"></span>
    <span>טוען נתונים...</span>
  </div>

  <div *ngIf="dateRangeError" class="error-message" role="alert">
    <span>{{ dateRangeError }}</span>
  </div>

  <div *ngIf="error && !loading" class="error-message" role="alert">
    <span>{{ error }}</span>
  </div>

  <app-requests-table
    *ngIf="!loading && result && !dateRangeError"
    [items]="result!.items"
    [sortBy]="query.sortBy"
    [sortDirection]="query.sortDirection"
    (sortChange)="onSortChange($event)">
  </app-requests-table>

  <app-pagination
    *ngIf="!loading && result && !dateRangeError && result.totalCount > 0"
    [page]="result.page"
    [pageSize]="result.pageSize"
    [totalCount]="result.totalCount"
    (pageChange)="onPageChange($event)">
  </app-pagination>

</div>
